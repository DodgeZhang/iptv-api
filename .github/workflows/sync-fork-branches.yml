name: Sync Fork Master
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Sync master from upstream Guovin/iptv-api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync DodgeZhang/iptv-api --source Guovin/iptv-api --branch master
