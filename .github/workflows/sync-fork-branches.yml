name: Sync Fork Master

permissions:
  contents: write

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Guovin/iptv-api.git
          git fetch upstream --no-tags

      - name: Merge upstream (keep local workflows)
        run: |
          # 合并上游代码，先不提交
          git merge upstream/master --no-edit --allow-unrelated-histories --no-commit
          # 强制把 .github/workflows 目录重置为合并前的本地版本，完全丢弃上游所有改动
          git read-tree HEAD -- .github/workflows/
          # 提交合并结果
          git commit --no-edit

      - name: Push to origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${GH_TOKEN}@github.com/DodgeZhang/iptv-api.git master
